name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            plugins/intent-loop/package-lock.json
      - name: Wait for exact-tag CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          CI_RUN_ID=""
          for attempt in $(seq 1 60); do
            CI_RUN_ID=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --branch "$GITHUB_REF_NAME" \
              --event push \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$GITHUB_SHA\") | .databaseId" \
              | head -n 1)
            if [ -n "$CI_RUN_ID" ]; then
              break
            fi
            sleep 10
          done
          test -n "$CI_RUN_ID"
          gh run watch "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          gh run view "$CI_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --json conclusion,headSha,jobs \
            > "$RUNNER_TEMP/exact-tag-ci.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const run = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/exact-tag-ci.json`, "utf8"));
          if (run.headSha !== process.env.GITHUB_SHA) throw new Error("CI head SHA does not match release tag");
          if (run.conclusion !== "success") throw new Error(`CI conclusion is ${run.conclusion}`);
          if (run.jobs.length !== 18) throw new Error(`expected 18 CI jobs, found ${run.jobs.length}`);
          const failed = run.jobs.filter((job) => job.conclusion !== "success");
          if (failed.length > 0) throw new Error(`non-success CI jobs: ${failed.map((job) => job.name).join(", ")}`);
          NODE
      - run: npm ci
        working-directory: plugins/intent-loop
      - run: npm test
        working-directory: plugins/intent-loop
      - run: npm audit --omit=dev --audit-level=high
        working-directory: plugins/intent-loop
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify generated distribution is committed
        run: git diff --exit-code -- plugins/intent-loop/runtime plugins/intent-loop/LICENSE plugins/intent-loop/NOTICE plugins/intent-loop/THIRD_PARTY_NOTICES.md plugins/intent-loop/SBOM.cdx.json dsh/tool-catalog.json dsh/SBOM.cdx.json dsh/THIRD_PARTY_NOTICES.md
      - name: Verify tag and installed identities match
        id: release-version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
          test "$VERSION" = "$(node -p "require('./plugins/intent-loop/package.json').version")"
          test "$VERSION" = "$(node -p "require('./plugins/intent-loop/.codex-plugin/plugin.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build all release assets
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/intent-loop-plugin-$GITHUB_REF_NAME.tar.gz" \
            -C plugins/intent-loop \
            .codex-plugin .mcp.json hooks runtime skills assets LICENSE NOTICE THIRD_PARTY_NOTICES.md SBOM.cdx.json
          npm pack --json --ignore-scripts --pack-destination artifacts > "$RUNNER_TEMP/dsh-pack.json"
          cp plugins/intent-loop/SBOM.cdx.json artifacts/SBOM.cdx.json
          cp dsh/SBOM.cdx.json artifacts/dsh-intent-loop-SBOM.cdx.json
          cd artifacts
          sha256sum \
            "intent-loop-plugin-$GITHUB_REF_NAME.tar.gz" \
            SBOM.cdx.json \
            "dsh-intent-loop-${{ steps.release-version.outputs.version }}.tgz" \
            dsh-intent-loop-SBOM.cdx.json \
            > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - name: Attest Codex archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/intent-loop-plugin-${{ github.ref_name }}.tar.gz
      - name: Attest Codex archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/intent-loop-plugin-${{ github.ref_name }}.tar.gz
          sbom-path: plugins/intent-loop/SBOM.cdx.json
      - name: Attest DeepSeek package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/dsh-intent-loop-${{ steps.release-version.outputs.version }}.tgz
      - name: Attest DeepSeek package SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/dsh-intent-loop-${{ steps.release-version.outputs.version }}.tgz
          sbom-path: dsh/SBOM.cdx.json
      - name: Attest checksum manifest provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/SHA256SUMS
      - name: Create draft and upload all assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease --draft --title "Intent Loop $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" artifacts/*
      - name: Verify draft asset bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft == true) | .id")
          test -n "$RELEASE_ID"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/draft-release.json"
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";
          const release = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/draft-release.json`, "utf8"));
          if (!release.draft || !release.prerelease) throw new Error("release must remain a draft prerelease during byte verification");
          const files = readdirSync("artifacts").sort();
          const assets = [...release.assets].sort((a, b) => a.name.localeCompare(b.name));
          if (files.length !== 5 || assets.length !== 5) throw new Error(`expected five assets; local=${files.length} remote=${assets.length}`);
          if (files.join("\n") !== assets.map((asset) => asset.name).join("\n")) throw new Error("draft asset names do not match local artifacts");
          for (const asset of assets) {
            const digest = `sha256:${createHash("sha256").update(readFileSync(join("artifacts", asset.name))).digest("hex")}`;
            if (asset.digest !== digest) throw new Error(`digest mismatch for ${asset.name}`);
          }
          NODE
      - name: Publish and verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease --title "Intent Loop $GITHUB_REF_NAME"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" --jq '.immutable')" = "true"
          VERIFIED=false
          for attempt in $(seq 1 6); do
            if gh release verify "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"; then
              VERIFIED=true
              break
            fi
            sleep 5
          done
          test "$VERIFIED" = "true"
          for asset in artifacts/*; do
            gh release verify-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY"
          done
