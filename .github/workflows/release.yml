name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: plugins/intent-loop/package-lock.json
      - run: npm ci
        working-directory: plugins/intent-loop
      - run: npm test
        working-directory: plugins/intent-loop
      - name: Verify generated distribution is committed
        working-directory: plugins/intent-loop
        run: git diff --exit-code -- runtime LICENSE NOTICE THIRD_PARTY_NOTICES.md SBOM.cdx.json
      - name: Verify tag matches package version
        shell: bash
        run: |
          VERSION=$(node -p "require('./plugins/intent-loop/package.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Build release archive
        shell: bash
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/intent-loop-plugin-$GITHUB_REF_NAME.tar.gz" \
            -C plugins/intent-loop \
            .codex-plugin .mcp.json hooks runtime skills assets LICENSE NOTICE THIRD_PARTY_NOTICES.md SBOM.cdx.json
          cp plugins/intent-loop/SBOM.cdx.json artifacts/SBOM.cdx.json
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/intent-loop-plugin-${{ github.ref_name }}.tar.gz
      - name: Attest release archive SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/intent-loop-plugin-${{ github.ref_name }}.tar.gz
          sbom-path: plugins/intent-loop/SBOM.cdx.json
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --verify-tag --generate-notes --prerelease
