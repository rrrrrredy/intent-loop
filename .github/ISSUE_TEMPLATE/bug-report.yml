name: Bug report
description: Report a reproducible Intent Loop defect using synthetic data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include real prompts, credentials, ledgers, task IDs, or exported intent graphs. Use private vulnerability reporting for security issues.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-beta.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Synthetic reproduction
      description: Give minimal steps and sanitized input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
